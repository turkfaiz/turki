<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>رصد العمداء</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Naskh+Arabic:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css?v=ui40" />
    <link rel="stylesheet" href="/journey.css?v=ui40" />
  </head>
  <body>
    <div class="sheet">
      <header class="mast">
        <div class="mast-right">
          <p class="gazette">نشرة الرصد الدولي</p>
          <h1>رصد العمداء</h1>
          <p class="sub" id="scope-line">جاري التحميل…</p>
        </div>
        <div class="mast-actions">
          <a class="health-pill is-idle" id="health-pill" href="/settings#tools" title="حالة الأدوات والتحقق من عملها">
            <i aria-hidden="true"></i><span id="health-text">يفحص الأدوات…</span>
          </a>
          <a class="btn-settings" href="/settings">الإعدادات</a>
        </div>
      </header>

      <form id="search-form" class="command">
        <label class="command-field command-office">
          <span>المكتب</span>
          <select id="mayor_id" name="mayor_id"><option value="">كل المكاتب</option></select>
        </label>
        <label class="command-field command-topic">
          <span>موضوع (اختياري)</span>
          <input id="q" name="q" type="search" placeholder="مثال: ميزانية، مياه… تُشترط كل كلماته في نص الخبر"
            title="يُصفّى ما يُجمع قبل حفظه: كل كلمة في الموضوع يجب أن ترد في عنوان الخبر أو نصه." />
        </label>
        <button type="submit" class="btn-search" id="search-btn">رصد الآن</button>
      </form>

      <section class="journey" id="journey" aria-label="رحلة الرصد"></section>
      <div class="journey-foot">
        <button type="button" class="jr-link-btn" id="history-toggle" aria-expanded="false">سجل الرحلات السابقة</button>
      </div>
      <section class="journey-history" id="history" hidden></section>

      <section class="desk">
        <div class="index">
          <nav class="tabs" role="tablist" aria-label="أقسام الأخبار">
            <button type="button" class="tab on" data-status="decision_ready" role="tab">بانتظار القرار <span class="tab-count num" data-count="decision_ready">0</span></button>
            <button type="button" class="tab" data-status="reading" role="tab">قيد القراءة <span class="tab-count num" data-count="reading">0</span></button>
            <button type="button" class="tab" data-status="verifying" role="tab">التدقيق <span class="tab-count num" data-count="verifying">0</span></button>
            <button type="button" class="tab" data-status="attention_required" role="tab">يحتاج تدخلاً <span class="tab-count num" data-count="attention_required">0</span></button>
            <button type="button" class="tab" data-status="approved" role="tab">المعتمد <span class="tab-count num" data-count="approved">0</span></button>
            <button type="button" class="tab" data-status="excluded" role="tab">المستبعد <span class="tab-count num" data-count="excluded">0</span></button>
          </nav>
          <p class="index-meta" id="desk-status"></p>
          <div id="list" class="list">جاري التحميل…</div>
        </div>
        <aside class="brief" id="detail"></aside>
      </section>
    </div>

    <script type="module" src="/app.js?v=ui40"></script>
  </body>
</html>
